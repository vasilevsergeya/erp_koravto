name: koravto-bilingual-verify
services:
  postgres:
    image: pgvector/pgvector:pg16
    mem_limit: 112m
    memswap_limit: 224m
    cpus: 0.25
    environment:
      POSTGRES_USER: verify
      POSTGRES_PASSWORD: synthetic-test-only
      POSTGRES_DB: verify
    tmpfs: ["/var/lib/postgresql/data"]
    command: ["postgres", "-c", "shared_buffers=16MB", "-c", "max_connections=20"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verify -d verify"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [verify]
  redis:
    image: redis:7.4-alpine
    mem_limit: 24m
    memswap_limit: 48m
    networks: [verify]
  verify:
    image: koravto-crm-api:current
    mem_limit: 192m
    memswap_limit: 512m
    cpus: 0.5
    user: "0:0"
    working_dir: /app
    volumes: ["../backend:/app:ro"]
    tmpfs: ["/data/files"]
    environment:
      PUBLIC_URL: https://crm-test.invalid
      DATABASE_URL: postgresql+psycopg://verify:synthetic-test-only@postgres/verify
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "0101010101010101010101010101010101010101010101010101010101010101"
      MASTER_ENCRYPTION_KEY: "0202020202020202020202020202020202020202020202020202020202020202"
      FILES_BACKEND: local
    command: ["python", "-m", "app.selftest"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    networks: [verify]
networks:
  verify:
    internal: true
