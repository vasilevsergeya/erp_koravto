[project]
name = "mobis-python-api"
version = "0.2.0"
description = "HTTP API for Hyundai/KIA Mobis part prices and store availability"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.111.0",
    "httpx[socks]>=0.27.0,<0.29.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mobis_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
